<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #fafafa;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: 4rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            margin-bottom: 1.5rem;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: #555;
            margin: 0 auto 1.5rem;
        }

        p {
            font-size: 1.1rem;
            color: #888;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ActFlow</h1>
        <div class="divider"></div>
        <p>Work in progress</p>
    </div>
</body>
</html>
