<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActFlow - Acceptance & Commitment Therapy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Jost', sans-serif;
            background: #f5f0eb;
            color: #4a4340;
            overflow: hidden;
        }

        .bg-glow {
            position: fixed;
            top: -30%;
            right: -20%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(210, 195, 175, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: glowDrift 12s ease-in-out infinite alternate;
        }

        .bg-glow-2 {
            position: fixed;
            bottom: -20%;
            left: -15%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(190, 200, 185, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: glowDrift2 15s ease-in-out infinite alternate;
        }

        @keyframes glowDrift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-40px, 30px) scale(1.05); }
        }

        @keyframes glowDrift2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -20px) scale(1.08); }
        }

        .container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .logo {
            max-width: clamp(260px, 40vw, 420px);
            height: auto;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeUp 1.4s ease-out 0.3s forwards, breathe 6s ease-in-out 1.7s infinite;
        }

        .subtitle {
            font-family: 'Jost', sans-serif;
            font-size: clamp(0.65rem, 1.8vw, 0.8rem);
            font-weight: 300;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: #9a8e84;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeUp 1.2s ease-out 0.8s forwards;
        }

        .divider {
            width: 1px;
            height: 50px;
            background: linear-gradient(to bottom, transparent, #c0b5a8, transparent);
            margin: 0 auto 2.5rem;
            opacity: 0;
            animation: fadeUp 1.2s ease-out 1.1s forwards;
        }

        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            font-weight: 300;
            font-style: italic;
            color: #7a706a;
            line-height: 1.8;
            max-width: 500px;
            margin: 0 auto 3rem;
            opacity: 0;
            animation: fadeUp 1.2s ease-out 1.4s forwards;
        }

        .status {
            font-family: 'Jost', sans-serif;
            font-size: 0.7rem;
            font-weight: 300;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #b5aa9e;
            opacity: 0;
            animation: fadeUp 1.2s ease-out 1.7s forwards;
        }

        .status::before,
        .status::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 1px;
            background: #c8bfb5;
            vertical-align: middle;
            margin: 0 1em;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes breathe {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-3px) scale(1.01); }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <img src="act_flow_logo-removebg-preview.png" alt="ActFlow" class="logo">

        <p class="subtitle">Acceptance & Commitment</p>

        <div class="divider"></div>

        <p class="tagline">
            Where stillness meets movement,<br>
            and journey begins.
        </p>

        <p class="status">Coming Soon</p>
    </div>
</body>
</html>
